<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Community Scam Map</title>
<style>
:root{--ink:#0B1F3A;--muted:#5B6B80;--line:#D6DEE8;--bg:#F5F7FA;--card:#fff;--green:#1E8E5A;--warn:#D9534F;--amber:#B7791F;--gray:#6B7C93}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari","Nirmala UI",sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
header b{font-size:18px}
.lang button{border:1px solid var(--line);background:#fff;padding:6px 10px;border-radius:16px;font-size:14px;color:var(--ink)}
.lang button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
nav{display:flex;gap:6px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
nav button{flex:1;padding:10px 4px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:15px;font-weight:600;color:var(--ink)}
nav button.on{background:var(--green);border-color:var(--green);color:#fff}
main{max-width:480px;margin:0 auto;padding:14px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-weight:600;margin:10px 0 5px;font-size:15px}
input,select,textarea{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:48px;resize:vertical}
.row{display:flex;gap:8px}
.btn{display:block;width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--green);color:#fff;font-size:17px;font-weight:700}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.btn:disabled{opacity:.6}
.postbar{position:sticky;bottom:0;z-index:2;margin:0 -14px;padding:8px 14px 10px;background:linear-gradient(rgba(255,255,255,0),#fff 10px)}
.postbar .btn{margin-top:0}
#rmsg{margin:0 0 8px}#rmsg:empty{display:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 4px;text-align:center;font-size:13px;line-height:1.2;color:var(--ink)}
.tile i{display:block;font-style:normal;font-size:24px;margin-bottom:4px}
.tile.on{border:2px solid var(--green);background:#EAF6EF}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:7px 12px;font-size:14px;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.verdict{display:inline-block;padding:6px 12px;border-radius:16px;color:#fff;font-weight:700;font-size:15px}
.v-KNOWN_SCAM{background:var(--warn)}.v-SUSPICIOUS{background:var(--amber)}.v-NO_REPORTS{background:var(--gray)}.v-VERIFIED_BUSINESS{background:var(--green)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;margin:8px 0;overflow-wrap:anywhere}
.muted{color:var(--muted);font-size:14px}
.advice{background:#FFF8E6;border-radius:10px;padding:10px;margin-top:10px;font-size:14px}
.ok{color:var(--green);font-weight:700}
.err{color:var(--warn);font-weight:600}
.hidden{display:none}
#expired{position:fixed;inset:0;background:#0B1F3A;color:#fff;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#expired.hidden{display:none}
#expired b{font-size:22px;margin:10px 0}
.cluster{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:8px 0}
.cluster>span:last-child{flex-shrink:0;white-space:nowrap}
.sev{font-size:12px;font-weight:700;padding:3px 8px;border-radius:10px;color:#fff}
.CRIT{background:var(--warn)}.HIGH{background:var(--amber)}.MED{background:var(--gray)}
a{color:var(--green)}
</style>
</head>
<body>
<header><b data-t="title"></b><span class="lang"><button id="l-en" class="on">EN</button> <button id="l-hi">हिन्दी</button></span></header>
<nav><button data-tab="check" class="on" data-t="tCheck"></button><button data-tab="report" data-t="tReport"></button><button data-tab="area" data-t="tArea"></button></nav>
<main>
<section id="check">
  <div class="card">
    <label for="q" data-t="qLabel"></label>
    <input id="q" autocomplete="off" inputmode="text">
    <div class="chips" id="qtype" style="margin-top:8px"></div>
    <button class="btn" id="go" data-t="checkBtn"></button>
  </div>
  <div id="result"></div>
</section>
<section id="report" class="hidden">
  <div class="card" id="rform">
    <label data-t="how"></label><div class="tiles" id="channels"></div>
    <label for="rv" data-t="what"></label><input id="rv" autocomplete="off">
    <div class="chips" id="rtype" style="margin-top:8px"></div>
    <label for="stype" data-t="kind"></label><select id="stype"></select>
    <label data-t="when"></label><div class="chips" id="when"></div>
    <label for="parea" data-t="areaL"></label><select id="parea"></select>
    <label for="note" data-t="note"></label><textarea id="note" maxlength="280"></textarea>
    <div class="postbar"><p id="rmsg"></p><button class="btn" id="post" data-t="postBtn"></button></div>
    <p class="muted"><span data-t="anonInfo"></span> <a href="#" id="resetid" data-t="resetId"></a></p>
  </div>
  <div id="rdone" class="hidden"></div>
</section>
<section id="area" class="hidden">
  <div class="card"><label for="aarea" data-t="areaL"></label><select id="aarea"></select></div>
  <div class="card"><b data-t="alertsH"></b><div id="alerts" class="muted"></div></div>
  <div class="card"><b data-t="mapH"></b><div id="clusters"></div></div>
</section>
</main>
<div id="expired" class="hidden"><div style="font-size:44px">🔒</div><b>Licence expired. Contact your provider.</b><div>लाइसेंस समाप्त हो गया है। अपने प्रदाता से संपर्क करें।</div></div>

 const b=r.body;lastCheck=b;
 $("result").innerHTML=`<div class="card"><div id="cbody">${cardHTML(b)}</div>
 ${b.verdict!=="VERIFIED_BUSINESS"?`<button class="btn" id="too" data-t="reportToo">${t("reportToo")}</button>`:""}<button class="btn alt" id="disp" data-t="dispute">${t("dispute")}</button><div id="dform"></div></div>`;
 const too=$("too");if(too)too.onclick=()=>{$("rv").value=v;rType=ty;tab("report")};
 $("disp").onclick=()=>{$("dform").innerHTML=`<label for="bn" data-t="bizName">${t("bizName")}</label><input id="bn"><label for="bm" data-t="bizMail">${t("bizMail")}</label><input id="bm" type="email"><button class="btn" id="dsend" data-t="send">${t("send")}</button><p id="dmsg"></p>`;
  $("dsend").onclick=async()=>{const r2=await api("/challenges",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({identifier_type:ty,identifier_value:v,claimant_name:$("bn").value,contact_email:$("bm").value,proof_note:""})});
   $("dmsg").innerHTML=r2.status===201?`<span class="ok" data-t="disputeSent">${t("disputeSent")}</span>`:`<span class="err" data-t="bad">${t("bad")}</span>`;if(r2.status===201)setTimeout(()=>check(v,ty),600)}}}
function rmsg(k){$("rmsg").innerHTML=k?`<span class="err" data-t="${k}">${t(k)}</span>`:""}
async function post(){const v=$("rv").value.trim(),ty=rType||detect(v),pin=$("parea").value;if(!v){rmsg("bad");$("rv").focus();return}
 const now=new Date(),off={now:0,today:3,yday:24,earlier:72}[whenSel];const occ=new Date(now.getTime()-off*3600e3);
 const body={report_id:"rep_"+uuid(),occurred_at:occ.toISOString(),reported_at:now.toISOString(),reporter_id:rid(),channel,scam_type:$("stype").value,
  identifier_type:ty,identifier_value:v,pincode:pin,note:$("note").value.slice(0,280),has_screenshot:false,amount_lost_inr:0};
 rmsg("");$("post").disabled=true;
 let r=null;try{r=await api("/reports",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)})}catch(e){}
 $("post").disabled=false;
 if(r&&r.status===201){store.set("area",pin);store.set("channel",channel);$("rv").value="";$("note").value="";rType=null;whenSel="now";render();showDone(v,ty)}
 else if(r&&r.status===400)rmsg(r.body.error==="invalid_pincode"?"badArea":"bad");
 else if(!r||r.status!==403)rmsg("net")}
async function showDone(v,ty){const my=++doneSeq;$("rform").classList.add("hidden");const d=$("rdone");d.className="";
 d.innerHTML=`<div class="card"><p class="ok" style="margin:0 0 10px" data-t="thanks">${t("thanks")}</p><div id="rcard"><span class="muted">…</span></div><button class="btn" id="again" data-t="another">${t("another")}</button></div>`;
 $("again").onclick=again;window.scrollTo(0,0);
 let r=null;try{r=await api(`/lookup?type=${encodeURIComponent(ty)}&value=${encodeURIComponent(v)}`)}catch(e){}
 if(my===doneSeq){lastDone=r&&r.status===200?r.body:null;$("rcard").innerHTML=lastDone?cardHTML(lastDone):""}}
function again(){doneSeq++;lastDone=null;$("rdone").className="hidden";$("rdone").innerHTML="";$("rform").classList.remove("hidden");rmsg("");
 window.scrollTo(0,0);if(!$("rv").value)$("rv").focus()}
async function loadArea(){const pin=$("aarea").value;store.set("area",pin);
 const [m,a]=await Promise.all([api(`/map?pincode=${pin}&days=7&radius_km=5`),api(`/alerts?pincode=${pin}`)]);
 const name=p=>(AREAS.find(x=>x[0]===p)||[p,p])[1];
 $("alerts").innerHTML=(a.body.alerts||[]).length?a.body.alerts.map(x=>x.type==="SPIKE"?`<p class="err">${t("spike",{c:x.count,b:x.baseline_per_day})}</p>`:`<p class="err">${t("newtype",{t:tname(x.scam_type)})}</p>`).join(""):t("none");
 $("clusters").innerHTML=(m.body.clusters||[]).length?m.body.clusters.map(c=>`<div class="cluster"><span>${name(c.pincode)} · ${tname(c.top_scam_type)}</span><span><b>${c.count}</b> <span class="sev ${c.severity}">${t("sev"+c.severity)}</span></span></div>`).join(""):`<p class="muted">${t("noClusters")}</p>`}
function tab(k){document.querySelectorAll("nav button").forEach(b=>b.className=b.dataset.tab===k?"on":"");["check","report","area"].forEach(s=>$(s).className=s===k?"":"hidden");if(k==="area")loadArea();
 if(k==="report"){typeChips($("rtype"),rType,x=>rType=x);if(!$("rdone").classList.contains("hidden"))again();else if(!$("rv").value)$("rv").focus()}}
function showExpired(on){$("expired").className=on?"":"hidden"}
async function licence(){try{const r=await fetch("/license");const b=await r.json();showExpired(!(b.valid===true||b.status==="valid"))}catch(e){}}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>tab(b.dataset.tab));
function repaint(){if(lastCheck&&$("cbody"))$("cbody").innerHTML=cardHTML(lastCheck);if(lastDone&&$("rcard"))$("rcard").innerHTML=cardHTML(lastDone);
 if(!$("area").classList.contains("hidden"))loadArea()}
function setLang(l){lang=l;store.set("lang",l);render();repaint()}
$("l-en").onclick=()=>setLang("en");$("l-hi").onclick=()=>setLang("hi");
$("go").onclick=()=>check($("q").value,qType);$("q").onkeydown=e=>{if(e.key==="Enter")check($("q").value,qType)};$("q").oninput=()=>{qType=detect($("q").value);typeChips($("qtype"),qType,k=>qType=k)};
$("rv").oninput=()=>{rType=detect($("rv").value);typeChips($("rtype"),rType,k=>rType=k)};$("post").onclick=post;$("aarea").onchange=loadArea;
$("resetid").onclick=e=>{e.preventDefault();store.set("rid","");rid()};
render();licence();setInterval(licence,10000);
</script>
</body>
</html>

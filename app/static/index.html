<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Community Scam Map</title>

<style>
/* The app's own layout and phone screens. The shared look (colours, header, cards, buttons) is in /static/theme.css. */
.stage{padding:14px 16px 40px}
.app{max-width:480px;margin:0 auto}
.side{display:none}
.app label{display:block;font-weight:600;margin:12px 0 6px;font-size:15px}
.app .card>label:first-child{margin-top:0}
.app input,.app select,.app textarea{width:100%}
textarea{min-height:48px;resize:vertical}
.app .btn{display:flex;width:100%;margin-top:14px;min-height:50px;font-size:17px}
.postbar{position:sticky;bottom:0;z-index:2;margin:0 -16px;padding:10px 16px 12px;background:linear-gradient(rgba(255,255,255,0),#fff 12px)}
.postbar .btn{margin-top:0}
#rmsg{margin:0 0 8px}#rmsg:empty{display:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:8px 4px;text-align:center;font-size:13px;line-height:1.2;color:var(--ink-2)}
.tile i{display:block;font-style:normal;font-size:22px;line-height:1.15;margin-bottom:3px}
.tile.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.kinds{grid-template-columns:repeat(4,1fr);gap:6px}
.kinds .tile{padding:7px 2px;font-size:12px}
.kinds .tile i{font-size:20px;margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--pill);padding:6px 13px;font-size:14px;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.app .mono{font-size:17px;margin:10px 0 6px;letter-spacing:-.01em;overflow-wrap:anywhere}
.advice{background:var(--amber-soft);border:1px solid var(--amber-line);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14px;color:#5B3B00}
.app .card>b:first-child{display:block;font-size:15px;margin-bottom:6px}
.cluster{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:10px 0}
.cluster:last-child{border-bottom:0}
.cluster>span:last-child{flex-shrink:0;white-space:nowrap}
/* AI reading of a pasted message: a suggestion, shown apart from the verdict */
.ai{margin-top:12px;padding:12px 14px;border:1px dashed var(--accent-line);border-radius:14px;background:var(--surface-2);font-size:14px;line-height:1.45}
.ai-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;margin-bottom:4px}.ai-h b{font-size:14.5px}
.ai-tag{font-size:11.5px;font-weight:700;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line);border-radius:var(--pill);padding:2px 8px}
.ai-type{margin:4px 0}.ai-words{margin:4px 0;color:var(--muted);overflow-wrap:anywhere}.ai .mono{font-size:13px;margin:0;color:var(--ink)}
.ai-flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.flag{font-size:12.5px;font-weight:600;color:var(--warn-text);background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:var(--pill);padding:3px 9px}
.ai-pre{margin:8px 0 0;color:var(--accent-text);font-weight:600}.ai .muted{margin:6px 0 0;font-size:12.5px}
.sev{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:var(--pill);border:1px solid}
.CRIT{background:var(--warn);border-color:var(--warn);color:#fff}.HIGH{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber)}.MED{background:var(--gray-soft);border-color:var(--gray-line);color:var(--gray)}
#expired{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;
  background-color:var(--night);color:var(--night-ink);background-size:32px 32px;
  background-image:linear-gradient(var(--night-line) 1px,transparent 1px),linear-gradient(90deg,var(--night-line) 1px,transparent 1px)}
#expired .code{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--gold)}
#expired .lk{font-size:44px;line-height:1}
#expired b{font-size:24px;line-height:1.25;max-width:520px}
#expired .hi{color:var(--night-muted);font-size:17px;max-width:520px}
/* laptop: the phone app in the centre, a short side panel beside it */
@media (min-width:1080px){
  body{background-image:radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 0);background-size:22px 22px}
  .stage{display:grid;grid-template-columns:minmax(0,1fr) 420px minmax(0,1fr);gap:40px;align-items:start;max-width:1240px;margin:0 auto;padding:36px 24px 64px}
  .app{max-width:none;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-xl);padding:12px 16px 6px;box-shadow:var(--shadow-lg)}
  .app::before{content:"";display:block;width:84px;height:5px;margin:0 auto 12px;border-radius:5px;background:var(--line-2)}
  .side{display:block;justify-self:end;max-width:360px;padding-top:4px}
  .side h1{margin:12px 0 12px;font-size:30px;line-height:1.12;font-weight:500;letter-spacing:-.03em}
  .side h1 em{display:block;font-weight:750;color:var(--accent-strong)}
  .side .lead{margin:0 0 18px;color:var(--muted);font-size:15.5px;line-height:1.55}
  .rules{padding:14px 16px 6px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow)}
  .rules ol{margin:8px 0 0;padding:0;list-style:none;counter-reset:r}
  .rules li{counter-increment:r;display:grid;grid-template-columns:30px minmax(0,1fr);gap:6px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.45}
  .rules li::before{content:"0" counter(r);padding-top:2px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--accent-text)}
  .links{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
}
</style>
</head>

["job-offer","Work-from-home job","घर से काम वाली नौकरी","Real jobs never ask you to pay a deposit.","असली नौकरी में कभी पैसे जमा करने को नहीं कहा जाता।"],
["lottery-prize","Lottery or prize","लॉटरी या इनाम","You cannot win a prize you never entered. Never pay a fee.","जिस इनाम में आपने हिस्सा ही नहीं लिया, वह आप नहीं जीत सकते। कोई फ़ीस न भरें।"],

["fake-customer-care","Fake customer care","नकली कस्टमर केयर","Take customer care numbers only from the official app or website.","कस्टमर केयर नंबर सिर्फ़ आधिकारिक ऐप या वेबसाइट से लें।"],
["otp-call","OTP or card call","OTP या कार्ड कॉल","Never share an OTP or PIN with anyone.","अपना OTP या PIN किसी को भी न बताएँ।"],

["other","Not sure","पता नहीं","If in doubt, hang up and call 1930.","शक हो तो कॉल काटें और 1930 पर कॉल करें।"]];
const KIND={"digital-arrest":["👮","Digital arrest","डिजिटल अरेस्ट"],"fake-kyc-link":["🔗","KYC link","KYC लिंक"],"upi-refund-qr":["💸","Refund QR","रिफंड QR"],
"investment-group":["📈","Investment","निवेश"],"courier-customs":["📦","Courier","कूरियर"],"job-offer":["💼","Job offer","नौकरी"],"lottery-prize":["🎁","Lottery","लॉटरी"],
"loan-app-harassment":["📱","Loan app","लोन ऐप"],"electricity-disconnection":["⚡","Power cut","बिजली कटौती"],"fake-customer-care":["🎧","Customer care","कस्टमर केयर"],
"otp-call":["🔑","OTP call","OTP कॉल"],"sextortion":["📹","Blackmail","ब्लैकमेल"],"other":["❓","Not sure","पता नहीं"]};
const AREAS=[["560102","HSR Layout","Bengaluru"],["560038","Indiranagar","Bengaluru"],["560034","Koramangala","Bengaluru"],["560066","Whitefield","Bengaluru"],
["560076","BTM Layout","Bengaluru"],["560011","Jayanagar","Bengaluru"],["560037","Marathahalli","Bengaluru"],["560103","Bellandur","Bengaluru"],
["560100","Electronic City","Bengaluru"],["560078","JP Nagar","Bengaluru"],["560003","Malleshwaram","Bengaluru"],["560010","Rajajinagar","Bengaluru"],
["560024","Hebbal","Bengaluru"],["560064","Yelahanka","Bengaluru"],["560070","Banashankari","Bengaluru"],["400050","Bandra West","Mumbai"],
["110016","Hauz Khas","Delhi"],["500081","Madhapur","Hyderabad"],["600020","Adyar","Chennai"],["411014","Viman Nagar","Pune"],
["700091","Salt Lake Sector V","Kolkata"],["380015","Satellite","Ahmedabad"],["302017","Malviya Nagar","Jaipur"],["226010","Gomti Nagar","Lucknow"],["682030","Kakkanad","Kochi"]];
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get("lang")||"en",qType=null,rType=null,channel=(CH.find(c=>c[0]===store.get("channel"))||CH[0])[0],whenSel="now",kind="other",doneSeq=0,lastCheck=null,lastDone=null;
// Every API or user value that goes into innerHTML passes through esc(). Static strings need none.
const esc=s=>String(s??"").replace(/[&<>"'`]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;","`":"&#96;"}[c]));
const t=(k,v={})=>(S[lang][k]||S.en[k]||k).replace(/\{(\w)\}/g,(_,x)=>esc(v[x]));   // parameters are values: escaped here, once
const uuid=()=>(crypto.randomUUID?crypto.randomUUID():"r"+Math.random().toString(16).slice(2)+Date.now().toString(16));
function rid(){let r=store.get("rid");if(!r){r="r_"+uuid();store.set("rid",r)}return r}
function detect(v){v=(v||"").trim();if(!v)return null;if(/^upi:\/\//i.test(v)||/^[^\s@]+@[a-z0-9]+$/i.test(v))return"upi";
 if(/^(https?:|hxxp|www\.)/i.test(v)||/^[a-z0-9-]+(\.[a-z0-9-]+)+(\/.*)?$/i.test(v))return"url";
 if(/^([a-z]{2}-?)?[a-z0-9]{6}(-[a-z])?$/i.test(v.replace(/\s/g,""))&&/[a-z]{3}/i.test(v))return"sender_id";return"phone"}
function typeChips(el,cur,set){el.innerHTML="";["phone","upi","url","sender_id"].forEach(k=>{const b=document.createElement("button");b.className="chip"+(k===cur?" on":"");
 b.textContent=t(k);b.onclick=()=>{set(k);typeChips(el,k,set)};el.appendChild(b)})}
async function api(path,opt){const r=await fetch(path,opt);let body={};try{body=await r.json()}catch(e){}
 if(r.status===403&&body.error==="LICENSE_EXPIRED"){showExpired(true)}return{status:r.status,body}}
function fmtDay(s){if(!s)return"";try{return new Date(s).toLocaleDateString(lang==="hi"?"hi-IN":"en-IN",{day:"numeric",month:"short",timeZone:"Asia/Kolkata"})}catch(e){return s.slice(0,10)}}
function tname(k){if(k==="other")return t("otherKind");const x=TYPES.find(a=>a[0]===k);return x?(lang==="hi"?x[2]:x[1]):k}
function render(){document.documentElement.lang=lang;document.title=t("title");document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
 $("l-en").className=lang==="en"?"on":"";$("l-hi").className=lang==="hi"?"on":"";
 $("channels").innerHTML="";CH.forEach(([v,ic,hi])=>{const b=document.createElement("button");b.className="tile"+(v===channel?" on":"");b.setAttribute("aria-pressed",v===channel);
  b.dataset.ch=v;b.innerHTML="<i>"+ic+"</i>"+(lang==="hi"?hi:v);b.onclick=()=>{channel=v;render()};$("channels").appendChild(b)});
 $("kinds").innerHTML="";TYPES.forEach(([k])=>{const [ic,en,hi]=KIND[k],b=document.createElement("button");b.className="tile"+(k===kind?" on":"");b.setAttribute("aria-pressed",k===kind);
  b.dataset.kind=k;b.innerHTML="<i>"+ic+"</i>"+(lang==="hi"?hi:en);b.onclick=()=>{kind=k;kindTouched=true;render()};$("kinds").appendChild(b)});
 $("when").innerHTML="";["now","today","yday","earlier"].forEach(k=>{const b=document.createElement("button");b.className="chip"+(k===whenSel?" on":"");b.textContent=t(k);
  b.onclick=()=>{whenSel=k;render()};$("when").appendChild(b)});
 for(const id of["parea","aarea"]){const cur=$(id).value||store.get("area")||"560102";$(id).innerHTML=AREAS.map(([p,a,c])=>`<option value="${p}">${a}, ${c}</option>`).join("");$(id).value=cur}
 typeChips($("qtype"),qType,k=>qType=k);typeChips($("rtype"),rType,k=>rType=k);paintPill()}
function cardHTML(b){const n=b.distinct_reporters;
 const sent=b.trust&&b.trust.hold?t("sBurst",{n:b.report_count}):b.verdict==="KNOWN_SCAM"?t("sKNOWN",{n}):b.verdict==="SUSPICIOUS"?t("sSUSP",{n,p:n===1?t("person"):t("people")}):b.verdict==="NO_REPORTS"?t("sNONE"):t("sVER",{l:b.label||""});
 const adv=b.scam_type?(TYPES.find(a=>a[0]===b.scam_type)||TYPES[12])[lang==="hi"?4:3]:"";
 return `<span class="verdict v-${esc(b.verdict)}">${esc(t(b.verdict))}</span><div class="mono">${esc(b.display_value)}</div><div><b>${sent}</b></div>
 ${b.challenged?`<div class="muted">${t("review")}</div>`:""}${b.last_seen?`<div class="muted">${t("last")}: ${esc(fmtDay(b.last_seen))}${b.scam_type?" · "+esc(tname(b.scam_type)):""}</div>`:""}
 ${adv&&b.verdict!=="VERIFIED_BUSINESS"?`<div class="advice">${esc(adv)}</div>`:""}`}
async function check(value,type){const v=(value||"").trim();if(!v)return;const ty=type||detect(v);lastCheck=null;aiShow("q");
 $("result").innerHTML='<div class="card muted">…</div>';
 let r;try{r=await api(`/lookup?type=${encodeURIComponent(ty)}&value=${encodeURIComponent(v)}`)}catch(e){$("result").innerHTML=`<div class="card err" data-t="net">${t("net")}</div>`;return}
 if(r.status===400){$("result").innerHTML=`<div class="card err" data-t="bad">${t("bad")}</div>`;return}if(r.status!==200)return;
 const b=r.body;lastCheck=b;
 $("result").innerHTML=`<div class="card"><div id="cbody">${cardHTML(b)}</div>
 ${b.verdict!=="VERIFIED_BUSINESS"?`<button class="btn" id="too" data-t="reportToo">${t("reportToo")}</button>`:""}<button class="btn alt" id="disp" data-t="dispute">${t("dispute")}</button><div id="dform"></div></div>`;
 const too=$("too");if(too)too.onclick=()=>{$("rv").value=v;rType=ty;tab("report")};
 $("disp").onclick=()=>{$("dform").innerHTML=`<label for="bn" data-t="bizName">${t("bizName")}</label><input id="bn"><label for="bm" data-t="bizMail">${t("bizMail")}</label><input id="bm" type="email"><button class="btn" id="dsend" data-t="send">${t("send")}</button><p id="dmsg"></p>`;
  $("dsend").onclick=async()=>{const r2=await api("/challenges",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({identifier_type:ty,identifier_value:v,claimant_name:$("bn").value,contact_email:$("bm").value,proof_note:""})});
   $("dmsg").innerHTML=r2.status===201?`<span class="ok" data-t="disputeSent">${t("disputeSent")}</span>`:`<span class="err" data-t="bad">${t("bad")}</span>`;if(r2.status===201)setTimeout(()=>check(v,ty),600)}}}
function rmsg(k){$("rmsg").innerHTML=k?`<span class="err" data-t="${k}">${t(k)}</span>`:""}
async function post(){const v=$("rv").value.trim(),ty=rType||detect(v),pin=$("parea").value;if(!v){rmsg("bad");$("rv").focus();return}
 const now=new Date(),off={now:0,today:3,yday:24,earlier:72}[whenSel];const occ=new Date(now.getTime()-off*3600e3);
 const body={report_id:"rep_"+uuid(),occurred_at:occ.toISOString(),reported_at:now.toISOString(),reporter_id:rid(),channel,scam_type:kind,
  identifier_type:ty,identifier_value:v,pincode:pin,note:$("note").value.slice(0,280),has_screenshot:false,amount_lost_inr:0};
 rmsg("");$("post").disabled=true;
 let r=null;try{r=await api("/reports",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)})}catch(e){}
 $("post").disabled=false;
 if(r&&r.status===201){store.set("area",pin);store.set("channel",channel);$("rv").value="";$("note").value="";rType=null;whenSel="now";aiReset();render();showDone(v,ty)}
 else if(r&&r.status===400)rmsg(r.body.error==="invalid_pincode"?"badArea":"bad");
 else if(!r||r.status!==403)rmsg("net")}
async function showDone(v,ty){const my=++doneSeq;$("rform").classList.add("hidden");const d=$("rdone");d.className="";
 d.innerHTML=`<div class="card"><p class="ok" style="margin:0 0 10px" data-t="thanks">${t("thanks")}</p><div id="rcard"><span class="muted">…</span></div><button class="btn" id="again" data-t="another">${t("another")}</button></div>`;
 $("again").onclick=again;window.scrollTo(0,0);
 let r=null;try{r=await api(`/lookup?type=${encodeURIComponent(ty)}&value=${encodeURIComponent(v)}`)}catch(e){}
 if(my===doneSeq){lastDone=r&&r.status===200?r.body:null;$("rcard").innerHTML=lastDone?cardHTML(lastDone):""}}
function again(){doneSeq++;lastDone=null;$("rdone").className="hidden";$("rdone").innerHTML="";$("rform").classList.remove("hidden");rmsg("");
 window.scrollTo(0,0);if(!$("rv").value)$("rv").focus()}
async function loadArea(){const pin=$("aarea").value;store.set("area",pin);
 const [m,a]=await Promise.all([api(`/map?pincode=${pin}&days=7&radius_km=5`),api(`/alerts?pincode=${pin}`)]);
 const name=p=>(AREAS.find(x=>x[0]===p)||[p,p])[1];
 $("alerts").innerHTML=(a.body.alerts||[]).length?a.body.alerts.map(x=>x.type==="SPIKE"?`<p class="err">${t("spike",{c:x.count,b:x.baseline_per_day})}</p>`:`<p class="err">${t("newtype",{t:tname(x.scam_type)})}</p>`).join(""):t("none");
 $("clusters").innerHTML=(m.body.clusters||[]).length?m.body.clusters.map(c=>`<div class="cluster"><span>${esc(name(c.pincode))} · ${esc(tname(c.top_scam_type))}</span><span><b>${esc(c.count)}</b> <span class="sev ${esc(c.severity)}">${esc(t("sev"+c.severity))}</span></span></div>`).join(""):`<p class="muted">${t("noClusters")}</p>`}
function tab(k){document.querySelectorAll("nav button").forEach(b=>b.className=b.dataset.tab===k?"on":"");["check","report","area"].forEach(s=>$(s).className=s===k?"":"hidden");if(k==="area")loadArea();
 if(k==="report"){typeChips($("rtype"),rType,x=>rType=x);if(!$("rdone").classList.contains("hidden"))again();else if(!$("rv").value)$("rv").focus()}}
// Licence pill in the shared header: ["ok"|"bad"|"wait", status from GET /license]
let lic=["wait",""];
function paintPill(){const [s,st]=lic;$("licPill").className="pill"+(s==="ok"?" ok":s==="bad"?" bad":"");$("licTxt").textContent=s==="ok"?t("licOk"):s==="bad"?(st==="expired"?t("licExp"):t("licBad")):"…"}
function showExpired(on){$("expired").className=on?"":"hidden";if(on&&lic[0]!=="bad")lic=["bad","expired"];paintPill()}
async function licence(){try{const r=await fetch("/license");const b=await r.json();const ok=b.valid===true||b.status==="valid";lic=[ok?"ok":"bad",b.status||""];showExpired(!ok)}catch(e){}}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>tab(b.dataset.tab));
function repaint(){if(lastCheck&&$("cbody"))$("cbody").innerHTML=cardHTML(lastCheck);if(lastDone&&$("rcard"))$("rcard").innerHTML=cardHTML(lastDone);
 if(!$("area").classList.contains("hidden"))loadArea()}
function setLang(l){lang=l;store.set("lang",l);render();repaint()}
$("l-en").onclick=()=>setLang("en");$("l-hi").onclick=()=>setLang("hi");
$("go").onclick=()=>check($("q").value,qType);$("q").onkeydown=e=>{if(e.key==="Enter")check($("q").value,qType)};$("q").oninput=()=>{qType=detect($("q").value);typeChips($("qtype"),qType,k=>qType=k)};
$("rv").oninput=()=>{rType=detect($("rv").value);typeChips($("rtype"),rType,k=>rType=k)};$("post").onclick=post;$("aarea").onchange=loadArea;
$("resetid").onclick=e=>{e.preventDefault();store.set("rid","");rid()};
function route(){tab(location.hash==="#check"?"check":location.hash==="#area"?"area":"report")}
window.addEventListener("hashchange",route);
// ------------------------------------------------------------------ AI reading of a pasted message, on this phone only
// ScamMapReader (static/ai/reader.js) suggests a kind of scam. It never changes a verdict and never sends the text:
// its model file is fetched once at page load, before there is any text, and classifying makes no request.
const aiText={q:"",r:""};let kindTouched=false,aiTimer=null;
function aiHTML(res,pre){const pct=Math.min(99,Math.round(res.confidence*100));   // never "100% sure": it is a suggestion
 const what=res.type==="not_scam"?`<div class="ai-type">${t("aiOk",{p:pct})}</div>`
  :`<div class="ai-type">${t("aiLooks")} <b>${esc(tname(res.type))}</b> · ${t("aiSure",{p:pct})}</div>`;
 const words=res.top_words.length?`<div class="ai-words">${t("aiWords")} ${res.top_words.map(w=>`<span class="mono">${esc(w)}</span>`).join(", ")}</div>`:"";
 const flags=res.flags.length?`<div class="ai-flags" aria-label="${esc(t("aiFlags"))}">${res.flags.map(f=>`<span class="flag" data-flag="${esc(f)}">${esc(t("flag_"+f))}</span>`).join("")}</div>`:"";
 return `<div class="ai-h"><b>${t("aiH")}</b><span class="ai-tag">${t("aiNote")}</span></div>${what}${words}${flags}`+
  (pre?`<p class="ai-pre">${t("aiPre")}</p>`:"")+`<p class="muted">${t("aiLocal")}</p>`}
function aiShow(which){const box=$(which==="q"?"aiq":"air");
 const res=window.ScamMapReader?ScamMapReader.classify(which==="q"?aiText.q:aiText.r+" "+$("note").value):null;
 if(!res){box.className="ai hidden";box.innerHTML="";return null}
 const sure=which==="r"&&res.type!=="not_scam"&&res.confidence>=0.7&&!kindTouched&&!!KIND[res.type];
 if(sure&&kind!==res.type){kind=res.type;render()}   // a suggestion only: one tap on another tile changes it
 box.className="ai";box.innerHTML=aiHTML(res,sure);return res}
function aiRefresh(){if(aiText.q&&!$("aiq").classList.contains("hidden"))aiShow("q");if((aiText.r+$("note").value).trim())aiShow("r")}
function aiReset(){aiText.r="";kindTouched=false;clearTimeout(aiTimer);$("air").className="ai hidden";$("air").innerHTML=""}
function aiSoon(){clearTimeout(aiTimer);aiTimer=setTimeout(()=>aiShow("r"),250)}
const pasted=e=>(e.clipboardData&&e.clipboardData.getData("text/plain"))||"";
$("q").addEventListener("input",()=>{aiText.q=$("q").value;$("aiq").className="ai hidden"});
// capture: the pasted text is read before any other paste handler runs (one may replace it with the number it finds)
$("q").addEventListener("paste",e=>{const s=pasted(e);if(s)aiText.q=s},true);
$("rv").addEventListener("input",()=>{aiText.r=$("rv").value;aiSoon()});
$("rv").addEventListener("paste",e=>{const s=pasted(e);if(s){aiText.r=s;setTimeout(()=>aiShow("r"),0)}},true);   // shown after the other handlers
$("note").addEventListener("input",aiSoon);
["l-en","l-hi"].forEach(id=>$(id).addEventListener("click",aiRefresh));
if(window.ScamMapReader)ScamMapReader.load().then(ok=>{if(ok)aiRefresh()});
render();route();licence();setInterval(licence,10000);
</script>

version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scammap
      POSTGRES_USER: scammap
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://scammap:localdev@db:5432/scammap
      TRUST_SALT: local-dev-salt-do-not-use-in-prod
      PORT: "8000"
      ALLOW_RESET: "1"
    depends_on:
      - db

volumes:
  pgdata:

databases:
  - name: scammap-db
    plan: free
    databaseName: scammap
    region: singapore

services:
  - type: web
    name: scammap
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scammap-db
          property: connectionString
      - key: TRUST_SALT
        generateValue: true
      - key: PORT
        value: "10000"
      - key: ALLOW_RESET
        value: "1"
